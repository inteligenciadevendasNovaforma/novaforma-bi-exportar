*{box-sizing:border-box}html,body{min-height:100%;margin:0}

.cab{display:flex;align-items:center;gap:48px;flex-wrap:wrap;padding:14px 24px;color:#fff;background:#0B2A4A}

.st.erro{background:#b42318}
h1{margin:0 0 8px;font-size:24px}p{color:#667085;line-height:1.55;margin:0 0 8px}
.arq{display:flex;justify-content:space-between;gap:16px;padding:12px 14px;margin:20px 0 14px;text-align:left;background:#f3f4f6;border:1px solid #e5e7eb;border-radius:10px}
a.bt{display:block;padding:13px 18px;color:#fff;background:#0B2A4A;border-radius:10px;font-weight:700;text-decoration:none}
.nota{font-size:12.5px}.oculto{display:none}
